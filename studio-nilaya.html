  <style>
    /* ==========================================================================
       CSS TOKENS & THEMING (Light & Dark via prefers-color-scheme)
       ========================================================================== */
    :root {
      /* Light theme tokens */
      --bg: #ECEDE9;
      --surface: #F6F6F3;
      --surface-elevated: #FFFFFF;
      --ink: #171A1C;
      --muted: #5B6166;
      --line: #D2D5D1;
      --line-subtle: #E2E5E1;
      --accent: #23405C; /* Ink Blue */
      --accent-hover: #182C40;
      --tint: #DCE3EA; /* Soft tint */
      --tint-subtle: #EEF3F7;
      --danger: #9B3B3B;

      /* Typography tokens */
      --font-serif: 'Instrument Serif', Garamond, 'Times New Roman', Georgia, serif;
      --font-body: 'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      /* Spatial & layout tokens */
      --container-max: 1220px;
      --gutter: 24px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-lg: 12px;
      --header-height: 72px;

      /* Transitions */
      --ease-calm: cubic-bezier(0.16, 1, 0.3, 1);
      --transition-fast: 0.18s ease;
      --transition-normal: 0.35s var(--ease-calm);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121517;
        --surface: #1A1E21;
        --surface-elevated: #22272B;
        --ink: #ECEDEA;
        --muted: #A3A9AE;
        --line: #2E3438;
        --line-subtle: #24292C;
        --accent: #8FB0D4;
        --accent-hover: #ABCAEC;
        --tint: #1C2631;
        --tint-subtle: #16202A;
        --danger: #E06C75;
      }
    }

    /* ==========================================================================
       BASE & RESET
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      color-scheme: light dark;
      background-color: var(--bg);
    }

    body {
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      padding-bottom: 70px; /* Space for mobile bar */
    }

    @media (min-width: 768px) {
      body {
        padding-bottom: 0;
      }
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
      object-fit: cover;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* Accessibility focus */
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Container */
    .container {
      width: 100%;
      max-width: var(--container-max);
      margin-left: auto;
      margin-right: auto;
      padding-left: var(--gutter);
      padding-right: var(--gutter);
    }

    /* Section padding */
    .section-spacing {
      padding-top: 88px;
      padding-bottom: 88px;
      border-bottom: 1px solid var(--line);
    }

    @media (max-width: 768px) {
      .section-spacing {
        padding-top: 60px;
        padding-bottom: 60px;
      }
    }

    /* Section Header */
    .section-header {
      margin-bottom: 48px;
      max-width: 720px;
    }

    .section-kicker {
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 3.8vw, 3rem);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .section-title em {
      font-style: italic;
      color: var(--accent);
    }

    .section-intro {
      margin-top: 16px;
      font-size: 1.0625rem;
      color: var(--muted);
      max-width: 600px;
      line-height: 1.65;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 26px;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      border-radius: var(--radius-sm);
      transition: background-color var(--transition-fast), color var(--transition-fast), border-color var(--transition-fast), transform var(--transition-fast);
      min-height: 48px;
      min-width: 44px;
      text-align: center;
      white-space: nowrap;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #FFFFFF;
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    @media (prefers-color-scheme: dark) {
      .btn-primary {
        color: #121517;
      }
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      border-color: var(--ink);
      background-color: var(--surface);
    }

    .btn-block {
      width: 100%;
    }

    /* Image Fallback container */
    .img-box {
      position: relative;
      overflow: hidden;
      background-color: var(--line);
      width: 100%;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s var(--ease-calm);
    }

    .img-box.img-fallback-active {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--line-subtle);
    }

    .img-box.img-fallback-active::before {
      content: 'Studio Photography Archive';
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.8;
      text-align: center;
      padding: 12px;
    }

    /* ==========================================================================
       DEMO BANNER
       ========================================================================== */
    .demo-strip {
      background-color: var(--tint);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 6px 16px;
      text-align: center;
      border-bottom: 1px solid var(--line);
    }

    /* ==========================================================================
       STICKY HEADER
       ========================================================================== */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(236, 237, 233, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      height: var(--header-height);
      display: flex;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .site-header {
        background-color: rgba(18, 21, 23, 0.94);
      }
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .site-logo {
      display: flex;
      flex-direction: column;
    }

    .site-logo-name {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    .site-logo-sub {
      font-size: 0.6875rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      position: relative;
      padding: 6px 0;
    }

    .nav-link:hover {
      color: var(--ink);
    }

    .header-cta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    @media (min-width: 900px) {
      .nav-links {
        display: flex;
      }
    }

    /* ==========================================================================
       HERO SECTION
       ========================================================================== */
    .hero {
      padding-top: 56px;
      padding-bottom: 72px;
      border-bottom: 1px solid var(--line);
    }

    .hero-content {
      max-width: 860px;
      margin-bottom: 40px;
    }

    .hero-headline {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 6vw, 4.25rem);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.015em;
      margin-bottom: 24px;
    }

    .hero-headline em {
      font-style: italic;
      color: var(--accent);
    }

    .hero-subline {
      font-size: clamp(1.0625rem, 2vw, 1.25rem);
      line-height: 1.6;
      color: var(--muted);
      max-width: 680px;
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .hero-visual {
      margin-top: 48px;
    }

    .hero-img-box {
      aspect-ratio: 16 / 9;
      border-radius: var(--radius-sm);
    }

    @media (max-width: 600px) {
      .hero-img-box {
        aspect-ratio: 4 / 3;
      }
    }

    .hero-caption {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 0.8125rem;
      color: var(--muted);
      border-left: 2px solid var(--accent);
      padding-left: 12px;
    }

    .quick-facts {
      margin-top: 48px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      border-top: 1px solid var(--line);
      padding-top: 36px;
    }

    @media (min-width: 768px) {
      .quick-facts {
        grid-template-columns: repeat(4, 1fr);
        gap: 32px;
      }
    }

    .fact-item {
      display: flex;
      flex-direction: column;
    }

    .fact-value {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.1;
    }

    .fact-label {
      margin-top: 4px;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.4;
    }

    /* ==========================================================================
       SELECTED WORK (PORTFOLIO GRID & LIGHTBOX)
       ========================================================================== */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 36px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      padding: 8px 18px;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 999px;
      background-color: var(--surface);
      color: var(--muted);
      border: 1px solid var(--line);
      white-space: nowrap;
      transition: all var(--transition-fast);
      min-height: 38px;
    }

    .filter-chip:hover {
      color: var(--ink);
      border-color: var(--muted);
    }

    .filter-chip.active {
      background-color: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }

    @media (prefers-color-scheme: dark) {
      .filter-chip.active {
        color: #121517;
      }
    }

    .work-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 36px 28px;
    }

    @media (min-width: 640px) {
      .work-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .work-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .work-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      group: card;
      outline: none;
      border-radius: var(--radius-sm);
    }

    .work-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .work-card-media {
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
    }

    .work-card:hover .img-box img {
      transform: scale(1.035);
    }

    .work-card-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .work-card-title {
      font-family: var(--font-serif);
      font-size: 1.375rem;
      font-weight: 400;
      color: var(--ink);
      line-height: 1.25;
      transition: color var(--transition-fast);
    }

    .work-card:hover .work-card-title {
      color: var(--accent);
    }

    .work-card-details {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .work-card-details span::after {
      content: "•";
      margin-left: 8px;
    }

    .work-card-details span:last-child::after {
      content: "";
      margin-left: 0;
    }

    /* Lightbox Modal */
    .lightbox-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(18, 21, 23, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
    }

    .lightbox-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-dialog {
      background-color: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      width: 100%;
      max-width: 980px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.24);
      display: flex;
      flex-direction: column;
      transform: translateY(20px);
      transition: transform var(--transition-normal);
      position: relative;
    }

    .lightbox-backdrop.active .lightbox-dialog {
      transform: translateY(0);
    }

    .lightbox-close {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 10;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--surface-elevated);
      color: var(--ink);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--transition-fast);
    }

    .lightbox-close:hover {
      background-color: var(--line);
    }

    .lightbox-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      padding: 24px;
    }

    @media (min-width: 820px) {
      .lightbox-body {
        grid-template-columns: 1.25fr 1fr;
        padding: 36px;
      }
    }

    .lightbox-gallery {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lightbox-main-img {
      aspect-ratio: 16 / 11;
      border-radius: var(--radius-sm);
    }

    .lightbox-thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .lightbox-thumb-btn {
      aspect-ratio: 4 / 3;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 2px solid transparent;
      padding: 0;
      transition: border-color var(--transition-fast);
      background-color: var(--line);
    }

    .lightbox-thumb-btn.active {
      border-color: var(--accent);
    }

    .lightbox-info {
      display: flex;
      flex-direction: column;
    }

    .lightbox-kicker {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .lightbox-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .lightbox-spec-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
      padding: 16px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
      font-size: 0.8125rem;
    }

    .spec-item-label {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.6875rem;
      margin-bottom: 2px;
    }

    .spec-item-val {
      font-weight: 500;
      color: var(--ink);
    }

    .lightbox-desc {
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .lightbox-scope-title {
      font-size: 0.8125rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 10px;
    }

    .lightbox-scope-list {
      list-style: none;
      margin-bottom: 28px;
    }

    .lightbox-scope-list li {
      font-size: 0.8125rem;
      color: var(--muted);
      margin-bottom: 6px;
      position: relative;
      padding-left: 18px;
      line-height: 1.45;
    }

    .lightbox-scope-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    /* ==========================================================================
       SERVICES SECTION
       ========================================================================== */
    .services-list {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .service-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 32px 0;
      border-bottom: 1px solid var(--line);
      transition: background-color var(--transition-fast);
    }

    @media (min-width: 768px) {
      .service-row {
        grid-template-columns: 2fr 3fr 1.5fr;
        align-items: baseline;
        gap: 32px;
      }
    }

    .service-title {
      font-family: var(--font-serif);
      font-size: 1.625rem;
      font-weight: 400;
      color: var(--ink);
    }

    .service-desc {

    /**
     * IMAGE ERROR HANDLER
     * Soft neutral replacement without broken icons
     */
    function handleImgError(el) {
      el.style.display = 'none';
      if (el.parentElement) {
        el.parentElement.classList.add('img-fallback-active');
      }
    }

    /**
     * CURRENCY FORMATTER (Indian ₹ L / ₹ Cr)
     */
    function formatCurrencyINR(amount) {
      if (amount >= 10000000) {
        const cr = (amount / 10000000).toFixed(2).replace(/\.00$/, '');
        return `₹${cr} Cr`;
      } else {
        const l = (amount / 100000).toFixed(2).replace(/\.00$/, '');
        return `₹${l} L`;
      }
    }

    /**
     * BUDGET ESTIMATOR ENGINE
     */
    function setupEstimatorEngine() {
      const slider = document.getElementById("est-area-slider");
      const areaText = document.getElementById("est-area-text");
      const scopeBtns = document.querySelectorAll(".scope-btn");
      const finishCards = document.querySelectorAll(".finish-card");
      const resultRange = document.getElementById("est-result-range");
      const resultRate = document.getElementById("est-result-rate");
      const resultTime = document.getElementById("est-result-time");
      const whatsappBtn = document.getElementById("est-whatsapp-btn");

      let currentArea = parseInt(slider.value, 10);
      let currentScopeKey = "full";
      let currentFinishKey = "signature";

      function roundToNearest50k(val) {
        return Math.round(val / 50000) * 50000;
      }

      function updateEstimator() {
        const scope = CONFIG.estimator.scopeFactors[currentScopeKey];
        const finish = CONFIG.estimator.rates[currentFinishKey];

        // Calculation: Area x Rate x ScopeFactor
        const rawMin = currentArea * finish.minRate * scope.factor;
        const rawMax = currentArea * finish.maxRate * scope.factor;

        const roundedMin = Math.max(roundToNearest50k(rawMin), 100000);
        const roundedMax = Math.max(roundToNearest50k(rawMax), 150000);

        // Effective per sq ft rate
        const effMinRate = Math.round(finish.minRate * scope.factor);
        const effMaxRate = Math.round(finish.maxRate * scope.factor);

        // Timeline scaling: base timeline + extra week for every 1000 sq ft above 1500 sq ft
        const areaBonusWeeks = Math.max(0, Math.floor((currentArea - 1500) / 1000));
        const timeMin = scope.timelineBase[0] + areaBonusWeeks;
        const timeMax = scope.timelineBase[1] + areaBonusWeeks;

        // Render UI
        if (areaText) areaText.textContent = currentArea.toLocaleString('en-IN');
        if (resultRange) resultRange.textContent = `${formatCurrencyINR(roundedMin)} – ${formatCurrencyINR(roundedMax)}`;
        if (resultRate) resultRate.textContent = `₹${effMinRate.toLocaleString('en-IN')} – ₹${effMaxRate.toLocaleString('en-IN')} / sq ft`;
        if (resultTime) resultTime.textContent = `${timeMin} – ${timeMax} weeks`;

        // Update WhatsApp prefilled link
        if (whatsappBtn) {
          const message = `Hello ${CONFIG.name},\n\nI used your budget estimator for a residential project in ${CONFIG.city}:\n• Scope: ${scope.name}\n• Carpet Area: ${currentArea} sq ft\n• Finish Level: ${finish.name}\n• Indicative Range: ${formatCurrencyINR(roundedMin)} – ${formatCurrencyINR(roundedMax)}\n• Timeline: ${timeMin} – ${timeMax} weeks\n\nI would like to discuss next steps and receive a detailed quote.`;
          whatsappBtn.onclick = () => {
            const url = `https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
          };
        }
      }

      // Slider listener
      slider.addEventListener("input", (e) => {
        currentArea = parseInt(e.target.value, 10);
        updateEstimator();
      });

      // Scope buttons
      scopeBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          scopeBtns.forEach(b => {
            b.classList.remove("active");
            b.setAttribute("aria-pressed", "false");
          });
          btn.classList.add("active");
          btn.setAttribute("aria-pressed", "true");
          currentScopeKey = btn.getAttribute("data-scope-key");
          updateEstimator();
        });
      });

      // Finish level cards
      finishCards.forEach(card => {
        card.addEventListener("click", () => {
          finishCards.forEach(c => {
            c.classList.remove("active");
            c.setAttribute("aria-pressed", "false");
          });
          card.classList.add("active");
          card.setAttribute("aria-pressed", "true");
          currentFinishKey = card.getAttribute("data-finish-key");
          updateEstimator();
        });
      });

      // Initial run
      updateEstimator();
    }

    /**
     * BOOKING FORM VALIDATION & WHATSAPP LINK GENERATOR
     */
    function setupBookingForm() {
      const form = document.getElementById("consultation-form");
      const nameInput = document.getElementById("book-name");
      const localityInput = document.getElementById("book-locality");
      const typeInput = document.getElementById("book-type");
      const areaInput = document.getElementById("book-area");
      const budgetInput = document.getElementById("book-budget");
      const startInput = document.getElementById("book-start");
      const notesInput = document.getElementById("book-notes");

      const errName = document.getElementById("err-book-name");
      const errLocality = document.getElementById("err-book-locality");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        let isValid = true;

        // Validate name
        const nameVal = nameInput.value.trim();
        if (!nameVal) {
          errName.classList.add("visible");
          nameInput.classList.add("is-invalid");
          isValid = false;
        } else {
          errName.classList.remove("visible");
          nameInput.classList.remove("is-invalid");
        }

        // Validate locality
        const localityVal = localityInput.value.trim();
        if (!localityVal) {
          errLocality.classList.add("visible");
          localityInput.classList.add("is-invalid");
          isValid = false;
        } else {
          errLocality.classList.remove("visible");
          localityInput.classList.remove("is-invalid");
        }

        if (!isValid) {
          if (!nameVal) nameInput.focus();
          else if (!localityVal) localityInput.focus();
          return;
        }

        // Build structured WhatsApp message
        const typeVal = typeInput ? typeInput.value : "";
        const areaVal = areaInput && areaInput.value ? `${areaInput.value} sq ft` : "Not specified";
        const budgetVal = budgetInput ? budgetInput.value : "";
        const startVal = startInput ? startInput.value : "";
        const notesVal = notesInput && notesInput.value.trim() ? notesInput.value.trim() : "None provided";

        const textLines = [
          `Hello ${CONFIG.name},`,
          ``,
          `I would like to book a design consultation for my residence:`,
          `• Name: ${nameVal}`,
          `• Property Type: ${typeVal}`,
          `• Locality: ${localityVal}`,
          `• Carpet Area: ${areaVal}`,
          `• Estimated Budget: ${budgetVal}`,
          `• Expected Start: ${startVal}`,
          `• Notes: ${notesVal}`,
          ``,
          `Please let me know your availability for an initial call or studio meeting in ${CONFIG.city}.`
        ];

        const fullMsg = textLines.join("\n");
        const waUrl = `https://wa.me/${CONFIG.phone}?text=${encodeURIComponent(fullMsg)}`;

        // Open WhatsApp
        window.open(waUrl, "_blank");
      });

      // Clear inline errors on input
      nameInput.addEventListener("input", () => {
        if (nameInput.value.trim()) {
          errName.classList.remove("visible");
          nameInput.classList.remove("is-invalid");
        }
      });

      localityInput.addEventListener("input", () => {
        if (localityInput.value.trim()) {
          errLocality.classList.remove("visible");
          localityInput.classList.remove("is-invalid");
        }
      });
    }
  </script>
